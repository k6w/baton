name: release
# Push a tag made by `bun scripts/version.ts <x.y.z>` (v<x.y.z>) to publish a release.
#
# Optional secrets (each step is skipped without its secret):
#   MACOS_CERT_P12, MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY   Developer ID signing (else ad-hoc)
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD                notarization
#   NPM_TOKEN                                                  npm: batonsh + batonsh-<platform>
#     (or no token: add this repo + release.yml as a "trusted publisher" on each package on
#      npmjs.com, then set the repository variable NPM_PUBLISH=oidc)
#   HOMEBREW_TAP_TOKEN                                         push Formula/baton.rb to <owner>/homebrew-tap
#   PyPI uses trusted publishing (environment "pypi"): no secret needed once configured on pypi.org.
on:
  push:
    tags: ["v*"]
  # re-run one publishing step for the current version (e.g. after setting up PyPI)
  workflow_dispatch:
    inputs:
      only:
        description: Publish only this
        type: choice
        options: [pypi]

permissions:
  contents: write
  id-token: write

env:
  BUN_VERSION: 1.3.10

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun scripts/version.ts --check
      - run: bunx tsc -p tsconfig.json --noEmit
      - run: bunx biome check .
      - run: bun test
        timeout-minutes: 8

  build-macos:
    if: github.event_name == 'push'
    needs: check
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --os='*' --cpu='*'
      - name: Import the Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - name: Build (signed)
        env:
          BATON_CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: bun scripts/build.ts --target darwin-arm64,darwin-x64
      - name: Notarize
        if: env.APPLE_ID != '' && env.MACOS_CERT_P12 != ''
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # a bare executable can't be stapled: Gatekeeper looks the ticket up online
          for t in darwin-arm64 darwin-x64; do
            ditto -c -k dist/baton-$t baton-$t.zip
            xcrun notarytool submit baton-$t.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          done
      - run: codesign --verify --strict dist/baton-darwin-arm64 dist/baton-darwin-x64
      - run: ./dist/baton-darwin-arm64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: bin-macos
          path: dist/baton-*
          if-no-files-found: error

  build-other:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --os='*' --cpu='*'
      - run: bun scripts/build.ts --target linux-x64,linux-arm64,linux-x64-musl,windows-x64
      - run: ./dist/baton-linux-x64 --version
      # Bun's musl builds link libstdc++/libgcc (not in a bare Alpine image)
      - run: docker run --rm -v "$PWD/dist:/d" alpine:3.20 sh -c "apk add -q libstdc++ libgcc && /d/baton-linux-x64-musl --version"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-other
          path: dist/baton-*
          if-no-files-found: error

  smoke-arm64:
    if: github.event_name == 'push'
    needs: build-other
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bin-other
          path: dist
      - run: chmod +x dist/baton-linux-arm64 && ./dist/baton-linux-arm64 --version

  publish:
    if: github.event_name == 'push'
    needs: [build-macos, build-other, smoke-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - run: chmod +x dist/baton-*
      # bunfig.toml preloads the Solid plugin, so scripts need the dependencies too
      - run: bun install --frozen-lockfile
      - run: bun scripts/release.ts --repo "$GITHUB_REPOSITORY"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --title "Baton ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md --verify-tag
      - uses: actions/setup-node@v4
        if: env.NPM_TOKEN != '' || env.NPM_PUBLISH == 'oidc'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm
        if: env.NPM_TOKEN != '' || env.NPM_PUBLISH == 'oidc'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # trusted publishing (OIDC, no token) needs npm >= 11.5
          npm install -g npm@latest
          # platform packages first: batonsh depends on them
          for d in dist/npm/cli-*; do npm publish "$d" --access public --provenance; done
          npm publish dist/npm/batonsh --access public --provenance
      - name: Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${owner}/homebrew-tap.git" tap
          mkdir -p tap/Formula && cp dist/release/baton.rb tap/Formula/baton.rb
          cd tap
          git config user.name "baton release" && git config user.email "release@users.noreply.github.com"
          git add Formula/baton.rb && git commit -m "baton ${GITHUB_REF_NAME#v}" && git push

  pypi:
    needs: check
    runs-on: ubuntu-latest
    environment: pypi
    # until trusted publishing is set up on pypi.org this fails without failing the release
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build sdk-python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk-python/dist
