name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bunx tsc -p tsconfig.json --noEmit
      - run: bunx biome check .
      - run: bun test
        # a full run takes ~1 minute; anything longer is a hang, not a slow test
        timeout-minutes: 8
      - run: bun scripts/build.ts
      - run: ./dist/baton --version

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun scripts/build.ts --all
      - uses: actions/upload-artifact@v4
        with:
          name: baton-binaries
          path: dist/baton-*
