[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "batonsh"
version = "0.3.2"
description = "Python SDK for Baton, the multi-agent coding TUI/daemon"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX",
  "Typing :: Typed",
]

[tool.hatch.build.targets.wheel]
packages = ["baton"]
